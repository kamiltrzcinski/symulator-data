repos:
  - repo: local
    hooks:
      - id: check-changelog
        name: Check CHANGELOG.md staged
        entry: python3 scripts/check-changelog.py
        language: python
        pass_filenames: false
      - id: validate-uids
        name: Validate UID registry
        entry: python3 scripts/precommit_validate.py
        language: python
        types: [json]
        pass_filenames: false
